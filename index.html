<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Monthsary, My Love Zoraiah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="petals" id="petals"></div>
 
<button class="music-toggle" id="musicToggle" aria-label="Toggle music">
  <span class="music-icon" id="musicIcon">♪</span>
</button>
<audio id="bg-music" loop>
  <source src="src/your-song.mp3" type="audio/mpeg">
</audio>
 
<main class="page">
 
  <header class="hero">
    <p class="eyebrow">A little something for</p>
    <h1 class="message">My love, Happy monthsary Zoraiah.</h1>
    <p class="subtext">every month with you feels like the first one</p>
  </header>
 
  <section class="carousel-section">
    <div class="carousel" id="carousel">
      <div class="carousel-track" id="carouselTrack">
        <div class="slide">
          <img src="src/photo1.jpg" alt="Us, moment one">
        </div>
        <div class="slide">
          <img src="src/photo2.jpg" alt="Us, moment two">
        </div>
        <div class="slide">
          <img src="src/photo3.jpg" alt="Us, moment three">
        </div>
        <div class="slide">
          <img src="src/photo4.jpg" alt="Us, moment four">
        </div>
        <div class="slide">
          <img src="src/photo5.jpg" alt="Us, moment five">
        </div>
      </div>
      <button class="carousel-arrow prev" id="prevBtn" aria-label="Previous photo">&#10094;</button>
      <button class="carousel-arrow next" id="nextBtn" aria-label="Next photo">&#10095;</button>
    </div>
    <div class="dots" id="dots"></div>
  </section>
 
  <section class="closing">
    <p class="closing-line">here's to more months, more memories, more us.</p>
    <div class="signature">— your bear 🐻</div>
  </section>
 
</main>
 
<script src="script.js"></script>
</body>
</html>
